name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build Windows
        shell: bash
        run: |
          set +e
          npm run electron:build:win 2>&1 | tee build.log
          code=$?
          if [ $code -ne 0 ]; then
            echo "### Windows build failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 build.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: dist-electron/*.exe
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build macOS
        shell: bash
        run: |
          set +e
          npm run electron:build:mac 2>&1 | tee build.log
          code=$?
          if [ $code -ne 0 ]; then
            echo "### macOS build failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 build.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build
          path: dist-electron/*.dmg
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build Linux
        shell: bash
        run: |
          set +e
          npm run electron:build:linux 2>&1 | tee build.log
          code=$?
          if [ $code -ne 0 ]; then
            echo "### Linux build failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 build.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: ignore

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/*.exe
            artifacts/macos-build/*.dmg
            artifacts/linux-build/*.AppImage
            artifacts/linux-build/*.deb
          draft: false
          generate_release_notes: true
